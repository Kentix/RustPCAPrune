[package]
name = "pcap-slim"
version = "0.1.0"
edition = "2021"
description = "RustPCAPrune — deterministic pcap slimmer; stream-truncates encrypted L4 payloads (TLS, QUIC, IPsec, SSH post-banner) while preserving headers, timestamps, TLS handshakes, and cleartext protocols."
license = "MIT"
authors = ["Kentix <31446072+Kentix@users.noreply.github.com>"]
readme = "README.md"
keywords = ["pcap", "tls", "quic", "forensics", "packet-capture"]
categories = ["command-line-utilities", "network-programming"]
repository = "https://github.com/Kentix/RustPCAPrune"
homepage = "https://github.com/Kentix/RustPCAPrune"
documentation = "https://github.com/Kentix/RustPCAPrune#readme"

[[bin]]
name = "pcap-slim"
path = "src/main.rs"

[features]
default = ["mmap"]
mmap = ["dep:memmap2"]

[dependencies]
clap = { version = "4", features = ["derive"] }
memmap2 = { version = "0.9", optional = true }
rayon = "1.10"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["user", "fs"] }
libc = "0.2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
serde_json = "1"
sha2 = "0.10"
tempfile = "3"

[[bench]]
name = "slim_bench"
harness = false

[[bin]]
name = "budget_check"
path = "benches/budget_check.rs"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
