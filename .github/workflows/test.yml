name: test

on:
  push:
  pull_request:

jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Use committed fixtures from fixtures/ — they are the canonical inputs
      # paired with the committed fixtures/expected_hashes.json. Regenerating
      # them in CI would couple test results to the runner's scapy version
      # and cause spurious hash-mismatch failures.

      - name: cargo test
        run: cargo test --verbose

      - name: Performance budgets
        run: cargo run --release --bin budget_check
