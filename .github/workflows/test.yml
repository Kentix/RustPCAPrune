name: test

on:
  push:
  pull_request:

jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Use committed fixtures from fixtures/ — they are the canonical inputs
      # paired with the committed fixtures/expected_hashes.json. Regenerating
      # them in CI would couple test results to the runner's scapy version
      # and cause spurious hash-mismatch failures.

      - name: cargo test
        run: cargo test --verbose

      - name: Performance budgets
        run: cargo run --release --bin budget_check

  golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install scapy
        run: python3 -m pip install --quiet scapy

      - name: Generate fixtures
        run: python3 scripts/gen_fixtures.py

      - name: Golden parity (ignored; needs ../PCAP_External_Cleaner/pcap_slim_lib.py)
        run: cargo test --test golden --test golden_fixtures -- --ignored --nocapture
        continue-on-error: true
