name: test

on:
  push:
  pull_request:

env:
  # Opt into Node.js 24 for JavaScript actions (e.g. actions/checkout@v4),
  # silencing the deprecation warning. GitHub will flip this default on
  # June 2 2026; setting it explicitly avoids the warning now.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Use committed fixtures from fixtures/ — they are the canonical inputs
      # paired with the committed fixtures/expected_hashes.json. Regenerating
      # them in CI would couple test results to the runner's scapy version
      # and cause spurious hash-mismatch failures.

      - name: cargo test
        run: cargo test --verbose

      - name: Performance budgets
        run: cargo run --release --bin budget_check
